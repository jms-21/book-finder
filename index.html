<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Book Finder</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <h2>Find your next book</h2>
        <p>Search for books by title or keyword.</p>

    <div>
        <input type="text" id="searchInput" value="javascript" placeholder="Enter a book title...">

        <button id="searchButton">Search</button>

        <select id="resultLimit">
            <option value="4">4 books</option>
            <option value="8" selected>8 books</option>
            <option value="12">12 books</option>
            <option value="20">20 books</option>
        </select>


    </div>

        <section>
            <h2>Search Results</h2>
            <div id="bookResults">
                <p>Enter a search term to find books.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Book Finder - 2026</p>
    </footer>
    <script src="script.js"></script>

</body>
</html>
